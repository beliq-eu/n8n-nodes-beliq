name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

  # test:integration calls the real beliq API and spends 4 documents (generate,
  # validate, parse, convert). BELIQ_API_KEY is a `blq_test_` sandbox key: it
  # runs the full rule stack but draws on the sandbox allowance instead of the
  # plan quota. Running it on pull_request as well as push paid twice for the
  # same tree, so it runs on the merge and on demand; `test` is what gates a
  # pull request. The preflight job then decides whether a run can complete
  # before it spends anything.
  #
  # Gating at job level rather than per step means a run that cannot be
  # exercised reports as skipped, which no one can misread as verified.
  preflight:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      # GET /v1/me is quota-exempt, so asking what is left costs nothing. A key
      # that is absent (forks) and an allowance that is spent are the same
      # condition from the test's point of view: the contract could not be
      # checked, which is not the same as the contract being broken.
      - id: decide
        env:
          BELIQ_API_KEY: ${{ secrets.BELIQ_API_KEY }}
        run: |
          set -uo pipefail

          # generate + validate + parse + convert
          needed=4

          if [ -z "${BELIQ_API_KEY:-}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "BELIQ_API_KEY is not set; skipping the live API smoke test."
            exit 0
          fi

          body="$(curl -sS --max-time 30 \
            -H "Authorization: Bearer $BELIQ_API_KEY" \
            https://api.beliq.eu/v1/me)" || body=''
          remaining="$(printf '%s' "$body" | jq -r '.data.quota.remaining // empty')" || remaining=''
          resets="$(printf '%s' "$body" | jq -r '.data.quota.resetsAt // empty')" || resets='unknown'

          # An unreadable answer is not a reason to skip: /v1/me is an
          # optimisation, and a real API outage should surface as a red live job
          # rather than a quiet one.
          if ! printf '%s' "$remaining" | grep -qE '^[0-9]+$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "could not read the remaining quota from /v1/me; running the live test anyway"
            exit 0
          fi

          echo "quota remaining: $remaining, resets $resets"
          if [ "$remaining" -lt "$needed" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::beliq API allowance is spent ($remaining of $needed documents left, resets $resets), so the live contract was NOT verified by this run."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  live:
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Live API smoke test
        env:
          BELIQ_API_KEY: ${{ secrets.BELIQ_API_KEY }}
        run: npm run test:integration
